<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Mitra UMKM - Login & Register</title>
    
    <link rel="icon" href="logo-tutahtitah-biru.webp" type="image/webp">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        sans: ['Inter', 'sans-serif'],
                        anton: ['Anton', 'sans-serif']
                    },
                    colors: {
                        brand: { 50: '#e6edf7', 100: '#ccdbef', 200: '#99b8df', 500: '#004aad', 600: '#003b8a', 900: '#001634' },
                        accent: { 500: '#ffde59' }
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-gray-800 bg-gray-50 antialiased min-h-screen flex flex-col">

    <!-- HEADER -->
    <nav class="bg-brand-500 shadow-sm sticky top-0 z-40 p-4">
        <div class="max-w-md mx-auto flex items-center justify-center">
            <h1 class="font-black italic text-2xl tracking-tighter transform -skew-x-6 text-white flex items-center cursor-pointer" onclick="window.location.href='index.html'">
                <span class="text-accent-500">TUTAH</span>TITAH 
                <span class="font-sans font-bold not-italic text-sm tracking-normal ml-3 border-l border-white/30 pl-3">Portal Mitra UMKM</span>
            </h1>
        </div>
    </nav>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-3xl shadow-xl border border-gray-100 overflow-hidden relative">
            
            <!-- Header Card -->
            <div class="bg-[#004aad] p-8 text-white text-center relative overflow-hidden">
                <div class="absolute top-0 right-0 -mt-6 -mr-6 w-24 h-24 bg-brand-600 rounded-full opacity-50 blur-xl"></div>
                <i class="ph ph-storefront text-5xl text-accent-500 mb-3 relative z-10"></i>
                <h2 id="form-title" class="text-2xl font-bold mb-1 relative z-10">Masuk ke Portal</h2>
                <p id="form-subtitle" class="text-brand-100 text-sm relative z-10">Kelola etalase UMKM Anda di Tutah Titah</p>
            </div>

            <!-- TOGGLE BUTTON -->
            <div class="flex p-2 bg-gray-50 border-b border-gray-100">
                <button onclick="switchMode('login')" id="btn-tab-login" class="flex-1 py-2 text-sm font-bold rounded-xl transition bg-white text-brand-600 shadow-sm border border-gray-200">Login</button>
                <button onclick="switchMode('register')" id="btn-tab-register" class="flex-1 py-2 text-sm font-bold rounded-xl transition text-gray-500 hover:text-gray-700">Daftar Baru</button>
            </div>

            <div class="p-6 sm:p-8">
                <!-- FORM LOGIN -->
                <form id="login-form" class="space-y-4 transition-all duration-300">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <i class="ph ph-envelope absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="email" id="login-email" required placeholder="email@gmail.com" class="w-full pl-11 pr-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
                        <div class="relative">
                            <i class="ph ph-lock-key absolute left-4 top-1/2 transform -translate-y-1/2 text-gray-400 text-lg"></i>
                            <input type="password" id="login-password" required placeholder="********" class="w-full pl-11 pr-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                        </div>
                        <div class="flex justify-end mt-2">
                            <button type="button" onclick="toggleForgotModal(true)" class="text-xs font-bold text-brand-600 hover:text-brand-800 transition">Lupa Password?</button>
                        </div>
                    </div>
                    <button type="submit" id="btn-submit-login" class="w-full bg-brand-500 text-white hover:bg-brand-600 py-3.5 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg mt-6">
                        Masuk <i class="ph ph-sign-in text-lg"></i>
                    </button>
                </form>

                <!-- FORM REGISTER (Hidden by default) -->
                <form id="register-form" class="space-y-4 hidden transition-all duration-300">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nama Pemilik <span class="text-red-500">*</span></label>
                        <input type="text" id="reg-pemilik" required placeholder="Contoh: Budi Santoso" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Nama Toko / Usaha <span class="text-red-500">*</span></label>
                        <input type="text" id="reg-toko" required placeholder="Contoh: Seblak Lalakon" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Email <span class="text-red-500">*</span></label>
                        <input type="email" id="reg-email" required placeholder="email@contoh.com" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-1">Password <span class="text-red-500">*</span></label>
                        <input type="password" id="reg-password" minlength="6" required placeholder="Minimal 6 karakter" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                    </div>
                    <button type="submit" id="btn-submit-register" class="w-full bg-brand-500 text-white hover:bg-brand-600 py-3.5 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-lg mt-6">
                        Daftar Jadi Mitra <i class="ph ph-user-plus text-lg"></i>
                    </button>
                </form>
            </div>
        </div>
    </main>

    <div id="forgot-modal" class="fixed inset-0 z-[100] bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-3xl w-full max-w-sm overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="forgot-modal-content">
            <div class="p-6 border-b border-gray-100 flex justify-between items-center">
                <h3 class="font-bold text-gray-900 text-lg">Reset Password</h3>
                <button onclick="toggleForgotModal(false)" class="text-gray-400 hover:text-red-500 transition"><i class="ph ph-x text-xl"></i></button>
            </div>
            <form id="forgot-form" class="p-6 space-y-4">
                <p class="text-xs text-gray-500 mb-2">Masukkan email terdaftar Anda. Kami akan mengirimkan tautan untuk membuat password baru.</p>
                <div>
                    <input type="email" id="forgot-email" required placeholder="email@contoh.com" class="w-full px-4 py-3 rounded-xl bg-gray-50 border border-gray-200 focus:border-brand-500 focus:outline-none text-sm transition">
                </div>
                <button type="submit" id="btn-submit-forgot" class="w-full bg-brand-500 text-white hover:bg-brand-600 py-3 rounded-xl font-bold transition flex items-center justify-center gap-2 shadow-md">
                    Kirim Link Reset <i class="ph ph-paper-plane-right"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- TOAST NOTIFICATION (Bawaan dari index.html lo) -->
    <div id="toast-notification" class="fixed top-6 left-1/2 transform -translate-x-1/2 -translate-y-[200%] opacity-0 z-[50] transition-all duration-500 flex items-center gap-3 bg-red-500 text-white px-5 py-3.5 rounded-2xl shadow-2xl w-[90%] max-w-sm">
        <i id="toast-icon" class="ph-fill ph-warning-circle text-2xl shrink-0"></i>
        <span id="toast-message" class="font-bold text-sm leading-tight flex-1">Pesan notifikasi...</span>
        <button onclick="closeToast()" class="text-white/80 hover:text-white transition shrink-0 p-1">
            <i class="ph ph-x text-lg"></i>
        </button>
    </div>

    <!-- UI Logic Toggle -->
    <script>
        function switchMode(mode) {
            const loginForm = document.getElementById('login-form');
            const regForm = document.getElementById('register-form');
            const btnLogin = document.getElementById('btn-tab-login');
            const btnReg = document.getElementById('btn-tab-register');
            const title = document.getElementById('form-title');
            const subtitle = document.getElementById('form-subtitle');

            if (mode === 'login') {
                loginForm.classList.remove('hidden'); regForm.classList.add('hidden');
                btnLogin.className = "flex-1 py-2 text-sm font-bold rounded-xl transition bg-white text-brand-600 shadow-sm border border-gray-200";
                btnReg.className = "flex-1 py-2 text-sm font-bold rounded-xl transition text-gray-500 hover:text-gray-700";
                title.innerText = "Masuk ke Portal"; subtitle.innerText = "Kelola etalase UMKM Anda di Tutah Titah";
            } else {
                loginForm.classList.add('hidden'); regForm.classList.remove('hidden');
                btnReg.className = "flex-1 py-2 text-sm font-bold rounded-xl transition bg-white text-brand-600 shadow-sm border border-gray-200";
                btnLogin.className = "flex-1 py-2 text-sm font-bold rounded-xl transition text-gray-500 hover:text-gray-700";
                title.innerText = "Daftar Kemitraan"; subtitle.innerText = "Mulai berjualan dan jangkau warga Cikalong Wetan";
            }
        }

        function toggleForgotModal(show) {
            const modal = document.getElementById('forgot-modal');
            const content = document.getElementById('forgot-modal-content');
            if(show) {
                modal.classList.remove('hidden');
                setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
            } else {
                modal.classList.add('opacity-0'); content.classList.add('scale-95');
                setTimeout(() => { modal.classList.add('hidden'); }, 300);
            }
        }

        let toastTimeout;
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast-notification');
            const msgEl = document.getElementById('toast-message');
            const iconEl = document.getElementById('toast-icon');
            
            msgEl.innerText = message;
            if(type === 'error') {
                toast.classList.replace('bg-green-500', 'bg-red-500');
                iconEl.className = "ph-fill ph-warning-circle text-2xl shrink-0";
            } else {
                toast.classList.replace('bg-red-500', 'bg-green-500');
                iconEl.className = "ph-fill ph-check-circle text-2xl shrink-0";
            }
            
            toast.classList.remove('-translate-y-[200%]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { closeToast(); }, 3500);
        }

        function closeToast() {
            const toast = document.getElementById('toast-notification');
            toast.classList.remove('translate-y-0', 'opacity-100');
            toast.classList.add('-translate-y-[200%]', 'opacity-0');
        }
    </script>

    <!-- FIREBASE LOGIC (Modular SDK) -->
    <script type="module">
        // 1. Import library Firebase versi terbaru (sesuai config lo)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail} from "https://www.gstatic.com/firebasejs/12.16.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.16.0/firebase-firestore.js";
        
        // 2. Config Firebase lo
        const firebaseConfig = {
            apiKey: "AIzaSyDVkYXJCiB5wY12M5Lte7jGO8d_J2NN00w",
            authDomain: "system-tutahtitah.firebaseapp.com",
            projectId: "system-tutahtitah",
            storageBucket: "system-tutahtitah.firebasestorage.app",
            messagingSenderId: "561053088556",
            appId: "1:561053088556:web:3914ab3b92b8123d8aca89"
        };

        // 3. Inisialisasi Firebase & Services
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // --- PROSES REGISTER ---
        document.getElementById('register-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-register');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Memproses...';
            btn.disabled = true;

            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const namaPemilik = document.getElementById('reg-pemilik').value;
            const namaToko = document.getElementById('reg-toko').value;

            try {
                // Buat user di Firebase Authentication
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                // Simpan profil dasar toko ke Firestore (Database)
                await setDoc(doc(db, "umkm_users", user.uid), {
                    nama_pemilik: namaPemilik,
                    nama_toko: namaToko,
                    email: email,
                    role: "umkm",
                    status: "draft", // Nanti bisa lo ubah jadi 'pending' kalau butuh verifikasi admin
                    created_at: serverTimestamp()
                });

                showToast("Pendaftaran berhasil! Silakan Login.", "success");
                
                // Bersihkan form & lempar ke tab login
                document.getElementById('register-form').reset();
                switchMode('login');

            } catch (error) {
                let errorMsg = "Terjadi kesalahan.";
                if(error.code === 'auth/email-already-in-use') errorMsg = "Email sudah terdaftar!";
                else if(error.code === 'auth/weak-password') errorMsg = "Password terlalu lemah!";
                showToast(errorMsg, "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // --- PROSES LOGIN ---
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-login');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Mencocokkan Data...';
            btn.disabled = true;

            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                showToast("Login Berhasil! Mengalihkan...", "success");
                
                // Lempar ke halaman dashboard setelah sukses login
                setTimeout(() => {
                    window.location.href = "dashboard.html"; 
                }, 1000);

            } catch (error) {
                showToast("Email atau password salah!", "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });

        // --- PROSES LUPA PASSWORD ---
        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-forgot');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i> Mengirim...';
            btn.disabled = true;

            const email = document.getElementById('forgot-email').value;

            try {
                await sendPasswordResetEmail(auth, email);
                showToast("Link reset password telah dikirim ke email Anda!", "success");
                document.getElementById('forgot-form').reset();
                toggleForgotModal(false); // Tutup modal
            } catch (error) {
                let errorMsg = "Gagal mengirim link reset.";
                if(error.code === 'auth/user-not-found') errorMsg = "Email tidak terdaftar!";
                showToast(errorMsg, "error");
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
